# GitHub Actions workflow for building and publishing this Odoo addon to AWS CodeArtifact
# Uses whool for packaging: release tags should be PEP 440 versions with five segments
# (e.g. v16.0.1.2.0) so __manifest__.py matches manifestoo's Odoo addon rules.
name: Build and Publish Addon to AWS CodeArtifact

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_REPO: DaysumOps/daysum-dev-ops
      TARGET_BRANCH: dev
      TARGET_REQUIREMENTS_FILE: requirements.txt
      PUBLISHED_PACKAGE_NAME: odoo-addon-${{ github.event.repository.name }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        pip install build whool

    - name: Extract version
      id: version
      run: |
        VERSION=$(python -c "import re; print(re.search(r\"'version'\\s*:\\s*'([^']+)'\", open('__manifest__.py').read()).group(1))")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Release Version: $VERSION"

    - name: Check if release exists
      id: check_release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="v${{ steps.version.outputs.version }}"
        if gh release view "$VERSION" --repo "${{ github.repository }}" 2>/dev/null; then
          echo "release_exists=true" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION already exists. Code released. Skipping build."
        else
          echo "release_exists=false" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION does not exist. Will create and publish."
        fi

    - name: Create release
      if: steps.check_release.outputs.release_exists == 'false'
      id: create_release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="v${{ steps.version.outputs.version }}"
        gh release create "$VERSION" --repo "${{ github.repository }}" \
          --title "$VERSION" \
          --generate-notes
        echo "created=true" >> "$GITHUB_OUTPUT"
        echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Update version in all files
      if: steps.check_release.outputs.release_exists == 'false'
      env:
        PACKAGE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Update __init__.py if it has __version__
        if grep -q "__version__" __init__.py 2>/dev/null; then
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" __init__.py
          echo "Updated __init__.py"
        fi
        # Update pyproject.toml if present
        if [ -f pyproject.toml ]; then
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          echo "Updated pyproject.toml"
        fi
        # Update __manifest__.py
        sed -i "s/'version'[[:space:]]*:[[:space:]]*'[^']*'/'version': '$VERSION'/" __manifest__.py
        echo "Updated __manifest__.py to $VERSION"

    - name: Ensure legacy setup.py is removed (whool handles build)
      if: steps.check_release.outputs.release_exists == 'false'
      run: |
        if [ -f setup.py ]; then
          rm setup.py MANIFEST.in 2>/dev/null || true
          echo "Removed legacy setup.py and MANIFEST.in (whool builds from pyproject.toml)"
        fi

    - name: Clean dist and build
      if: steps.check_release.outputs.release_exists == 'false'
      run: |
        rm -rf dist/
        echo "Building package..."
        WHOOL_POST_VERSION_STRATEGY_OVERRIDE=none python -m build
        echo "Build completed."
        ls -la dist/

    - name: Configure AWS credentials
      if: steps.check_release.outputs.release_exists == 'false'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

    - name: Publish to AWS CodeArtifact
      if: steps.check_release.outputs.release_exists == 'false'
      env:
        CA_DOMAIN: daysum
        CA_REPO: odoo-pypi
        AWS_ACCOUNT_ID: "851725548528"
      run: |
        echo "Version: ${{ steps.version.outputs.version }}"
        ls -la dist/
        shopt -s nullglob; w=(dist/*.whl); s=(dist/*.tar.gz)
        if [ ${#w[@]} -eq 0 ]; then echo "::error::No wheel in dist/"; exit 1; fi
        if [ ${#s[@]} -eq 0 ]; then echo "::error::No sdist in dist/"; exit 1; fi
        pip install twine
        aws codeartifact login --tool twine \
          --domain "$CA_DOMAIN" \
          --domain-owner "$AWS_ACCOUNT_ID" \
          --repository "$CA_REPO"
        twine upload --repository codeartifact dist/* --verbose
        echo "CodeArtifact publish completed."

    - name: Verify package
      if: steps.check_release.outputs.release_exists == 'false'
      run: |
        echo "Confirming package version in CodeArtifact..."
        aws codeartifact list-package-versions \
          --domain daysum \
          --domain-owner 851725548528 \
          --repository odoo-pypi \
          --format pypi \
          --package ${{ env.PUBLISHED_PACKAGE_NAME }} \
          --max-results 5 \
          --output table
        WHEEL_FILE=$(ls dist/*.whl | head -1 | xargs basename)
        pip install "dist/$WHEEL_FILE" --dry-run --no-deps || {
          echo "Wheel dry-run failed!"
          exit 1
        }
        echo "Verification completed."

    - name: Checkout target requirements repo
      if: steps.check_release.outputs.release_exists == 'false'
      uses: actions/checkout@v4
      with:
        repository: ${{ env.TARGET_REPO }}
        ref: ${{ env.TARGET_BRANCH }}
        token: ${{ secrets.MONOREPO_SYNC_TOKEN }}
        path: target-repo

    - name: Update package version in target requirements
      if: steps.check_release.outputs.release_exists == 'false'
      env:
        PACKAGE_NAME: ${{ env.PUBLISHED_PACKAGE_NAME }}
        PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        REQUIREMENTS_FILE: target-repo/${{ env.TARGET_REQUIREMENTS_FILE }}
      run: |
        python << 'PY'
        from pathlib import Path
        import os, re, sys
        requirements_file = Path(os.environ["REQUIREMENTS_FILE"])
        package_name = os.environ["PACKAGE_NAME"]
        package_version = os.environ["PACKAGE_VERSION"]
        target_line = f"{package_name}=={package_version}"
        if not requirements_file.exists():
            print(f"::error::Requirements file not found: {requirements_file}")
            sys.exit(1)
        lines = requirements_file.read_text(encoding="utf-8").splitlines()
        changed = False
        matched = False
        exact_pattern = re.compile(rf"^\s*{re.escape(package_name)}\s*(==|>=|<=|~=|!=|>|<).*$", re.IGNORECASE)
        new_lines = []
        for line in lines:
            if exact_pattern.match(line):
                matched = True
                if line.strip() != target_line:
                    new_lines.append(target_line)
                    changed = True
                else:
                    new_lines.append(line)
                continue
            new_lines.append(line)
        if not matched:
            if new_lines and new_lines[-1].strip():
                new_lines.append("")
            new_lines.append(target_line)
            changed = True
        if changed:
            requirements_file.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
            print(f"Updated {requirements_file} with: {target_line}")
        else:
            print("No requirements update needed.")
        PY

    - name: Commit and push requirements update
      if: steps.check_release.outputs.release_exists == 'false'
      working-directory: target-repo
      env:
        PACKAGE_NAME: ${{ env.PUBLISHED_PACKAGE_NAME }}
        PACKAGE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        if git diff --quiet -- "${{ env.TARGET_REQUIREMENTS_FILE }}"; then
          echo "No change to commit"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${{ env.TARGET_REQUIREMENTS_FILE }}"
        git commit -m "chore: bump ${PACKAGE_NAME} to ${PACKAGE_VERSION}"
        git push origin "${{ env.TARGET_BRANCH }}"

    - name: Cleanup - delete release on pipeline failure
      if: failure() && steps.create_release.outputs.created == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete "${{ steps.create_release.outputs.tag }}" --repo "${{ github.repository }}" --yes
        echo "Deleted release ${{ steps.create_release.outputs.tag }} due to pipeline failure"
